[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-file-system-assistant"
version = "0.1.0"
description = "A safe, tool-driven assistant for reading, listing, searching, and writing local resume files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.31,<2",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "python-dotenv>=1,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
llm-file-assistant = "llm_file_assistant:main"
filepilot-web = "web_app:run"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "reportlab>=4,<5",
    "ruff>=0.8,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "config",
    "contracts",
    "fs_tools",
    "llm_file_assistant",
    "path_policy",
    "tool_registry",
    "web_app",
]
packages = ["extractors", "providers"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
